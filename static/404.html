<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<script>
			(function () {
				const location = window.location;
				const url = location.pathname + location.search + location.hash;
				const base = '/portfolio';

				if (sessionStorage.getItem('redirecting') == '1') {
					return;
				}
				sessionStorage.setItem('redirecting', '1');


				const params = new URLSearchParams(location.search);
				if (params.has('redirect')) return;
				params.set('redirect', url);

				location.replace(new URL(`${location.origin}${base}?${params}`));
			})();
		</script>
	</head>

	<body>
		Redirecting...
	</body>

	<script>
		setTimeout(() => {
			const url = location.origin + location.pathname + location.search + location.hash;
			document.body.innerHTML = `<h2>Page not found</h2><br><p>${url}</p>`;
			sessionStorage.removeItem('redirecting');
		}, 1000);
	</script>
</html>
